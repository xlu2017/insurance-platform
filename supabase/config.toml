project_id = "insurance-autopilot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081",
  "http://127.0.0.1:8081",
  "http://localhost:8081/auth/callback",
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "exp://localhost:8081",
  "exp://localhost:8081/--/auth/callback",
  "insurance-autopilot://",
  "insurance-autopilot://auth/callback",
]
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# External OAuth/OIDC providers. Secrets are sourced from environment variables
# (never hardcoded); populate them via the shell running `supabase start`.
# New SSO users still land as `customer` through handle_new_user(); staff
# elevation remains service-role-only via assign_staff_role().
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# Default for a direct-localhost stack. If Supabase is reached over a public
# tunnel (e.g. *.loca.lt), override this locally with the tunnel callback and
# register the SAME URL on the Google client (see .env.local.example).
redirect_uri = "http://localhost:54321/auth/v1/callback"

[functions.stripe-webhook]
verify_jwt = false

[functions.verify-address]
verify_jwt = true

[edge_runtime]
enabled = true
policy = "per_worker"
